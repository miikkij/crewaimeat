# Pre-commit hooks — fast, local quality gate. Install once with:  uv run pre-commit install
# Runs only on the files you stage, so it never churns the whole tree on one commit.
# Ruff is the single linter+formatter (see [tool.ruff] in pyproject.toml). The full pytest floor
# runs in CI, not here, to keep commits quick.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff            # lint, auto-fixing what it safely can
        args: [--fix]
      - id: ruff-format     # format (already a no-op on the current tree — line-length 120)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  # The reconciliation gate. Ruff sees ONE FILE at a time and cannot know that a new crew is missing
  # from three registries, or that a call reaches the node without passing through the dispatcher —
  # those are statements about the whole repo, so they need a whole-repo check. Offline (~1s), no
  # network: the node lens is opt-in (`--strict --live`) and CI does not run it.
  # `pass_filenames: false` because the check is about the repo, not the staged files.
  - repo: local
    hooks:
      - id: crewaimeat-doctor
        name: crewaimeat doctor (registries + route conformance)
        entry: uv run crewaimeat doctor --strict
        language: system
        pass_filenames: false
        always_run: true
