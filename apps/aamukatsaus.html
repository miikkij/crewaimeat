<!doctype html>
<!--
  Aamukatsaus — the morning briefing as a shared surface instead of one person's inbox.

  Built against /v1/prompts/build-app (the canonical spec). Two things the first cut got wrong and
  this one gets right, both written down so the next edit does not undo them:

  1. NAMESPACE RULE (spec §"Namespace rule"). Everything shown here is written by AGENTS over MCP —
     postman, some-analyst — so it lives under the AGENT's GAII, not the signed-in human's. A plain
     AIMEAT.data.get() reads the human's own namespace and finds nothing, which is exactly why the
     first version rendered an empty page for the owner. Every read below therefore goes through
     list({ownerScope:true}) + get(key,{agent:owner_gaii}).
  2. THEME. The platform owns light/dark (data-theme) AND the palette (data-palette); the login pill
     carries both controls. The first cut hardcoded its own colours behind prefers-color-scheme, so
     the user's toggle did nothing. Here every colour is a daisyUI/theme token.

  Reads (all agent-written): mail.morning.public.<date> · mail.pulse.<date> · some.queue.latest ·
  some.grok.<date>.  Writes exactly one kind of key: some.grok.inbox.<ts>, a raw paste an agent
  structures later. The browser never parses a Grok run and never touches a workspace.
-->
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aimeat-app" content="aamukatsaus.html">
<meta name="aimeat-locales" content="fi">
<!-- memory:write is the Grok paste and the "copy to myself" button, both landing in the READER's own
     namespace. messages:send is the subscription: an app cannot write into our memory, so an order
     travels as a DM to postman, who validates and saves it. Nothing here asks for share:manage —
     handing out access to memory is not something a briefing reader should be asked to approve. -->
<meta name="aimeat-scopes" content="memory:read memory:write messages:send messages:read">
<title>Aamukatsaus · crewaimeat</title>
<script>
/* Restore BOTH theme axes before first paint (spec) — no flash of the wrong look, and the login
   pill's controls keep working because we never own them. */
(function(){ function mode(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light"); }
  function pal(p){ if(p && p!=="aimeat") document.documentElement.setAttribute("data-palette", p); else document.documentElement.removeAttribute("data-palette"); }
  mode(localStorage.getItem("aimeat-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  pal(localStorage.getItem("aimeat-palette"));
  addEventListener("storage", function(e){ if(e.key==="aimeat-theme" && e.newValue) mode(e.newValue);
    if(e.key==="aimeat-palette" && e.newValue) pal(e.newValue); }); })();
</script>
<link href="https://aimeat.io/lib/daisyui@5.css" rel="stylesheet" type="text/css">
<link href="https://aimeat.io/lib/aimeat-theme.css" rel="stylesheet" type="text/css">
<link href="https://aimeat.io/lib/aimeat-daisyui-bridge.css" rel="stylesheet" type="text/css">
<script src="https://aimeat.io/lib/tailwindcss@4.js"></script>
<style>
  /* Only structure — never colour. Wide content scrolls inside its own box so the page body never
     scrolls sideways on a phone (appdev pitfall grid-track-blowout). */
  .scroll-x{ overflow-x:auto; min-width:0 }
  .md h1,.md h2{ font-size:var(--text-title); margin:1.4rem 0 .4rem; font-weight:650 }
  .md h3{ margin:1rem 0 .3rem; font-weight:600 }
  .md p{ margin:.4rem 0 } .md ul{ margin:.4rem 0 .4rem 1.2rem; list-style:disc }
  .md a{ text-decoration:underline }
  .md pre,pre.raw{ white-space:pre-wrap; word-break:break-word }
</style>
</head>
<body class="bg-base-100 text-base-content min-h-screen">
<div class="navbar bg-base-200 border-b border-base-300 sticky top-0 z-10 gap-1 flex-wrap">
  <span class="font-semibold px-2">☀️ Aamukatsaus</span>
  <div role="tablist" class="tabs tabs-box tabs-sm">
    <button role="tab" class="tab tab-active" data-tab="katsaus">Katsaus</button>
    <button role="tab" class="tab" data-tab="pulssi">Pulssi</button>
    <button role="tab" class="tab" data-tab="jono">Jono</button>
    <button role="tab" class="tab" data-tab="grok">Grok</button>
    <button role="tab" class="tab" data-tab="tilaus">Tilaus</button>
  </div>
  <div class="flex-1"></div>
  <span id="header-auth"></span>
</div>
<main class="max-w-4xl mx-auto p-4 pb-24">
  <div id="status" class="opacity-70 py-8 text-center">Ladataan…</div>
  <div id="view"></div>
</main>
<script>
/* The ONE writer whose public mirror this app reads (crewaimeat.share_public). Everything else is
   discovered from the index it publishes: getPublic() needs an EXACT key and there is no public
   listing, so without the index the archive and date pickers would be impossible. */
const PUB_GAII="postman#happydude500001@aimeat-finland-001-genesis";
const INDEX_KEY="aamukatsaus.share.index";
const KEY_BRIEF="mail.morning.public", KEY_PULSE="mail.pulse", KEY_QUEUE="some.queue.latest", KEY_GROK="some.grok";
let TAB="katsaus", BRIEF_DATE=null, INDEX=null, SESSION=null;
/* Reading source for the briefing: null = the open public mirror; otherwise a space someone has
   shared with the signed-in viewer. Only the briefing has a per-subscriber form — pulse, queue and
   the Grok archive are the operator's own instrumentation and stay on the public mirror. */
let SHARES=[], SOURCE=null;

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<)"']+)/g,'<a class="link" href="$1" target="_blank" rel="noopener">$1</a>');
const num=n=>(n==null?"–":typeof n==="number"?n.toLocaleString("fi-FI"):String(n));
const usd=n=>(n==null?"–":"$"+Number(n).toFixed(4));

/* ── data ─────────────────────────────────────────────────────────────────────
   PUBLIC FIRST, so a colleague who was given the link sees exactly what the owner sees, without an
   account. The authenticated read is a FALLBACK for the owner only: the public mirror is rebuilt
   once a day, so between the agents writing and the mirror running the owner would otherwise see
   stale data. Agent-written keys need ownerScope (spec §Namespace rule) and meta:true keeps a
   listing from inlining every value. */
async function pub(key){
  try{ return await AIMEAT.data.getPublic(PUB_GAII, key); }catch(e){ return null; }
}
async function ownList(prefix){
  if(!SESSION) return [];
  try{
    const r=await AIMEAT.data.list({prefix, ownerScope:true, meta:true});
    return ((r&&r.items)||[]).filter(i=>i&&typeof i.key==="string");
  }catch(e){ return []; }
}
async function ownGet(key){
  if(!SESSION) return null;
  try{ return await AIMEAT.data.get(key,{ownerScope:true}); }catch(e){ return null; }
}
/* One value: the shared copy if there is one, otherwise the owner's own. */
async function val(publicKey, ownerKey){
  const p=await pub(publicKey);
  if(p!=null) return p;
  return ownerKey?await ownGet(ownerKey):null;
}
async function loadIndex(){
  if(INDEX) return INDEX;
  INDEX=(await pub(INDEX_KEY))||{briefing:[],pulse:[],grok:[],queue:null};
  return INDEX;
}

/* ── shared spaces (node share model, 2026-08-11) ─────────────────────────────
   A share is (owner, group, key_pattern); the record itself stays PRIVATE, so getPublic() — which
   fetches unauthenticated — cannot read it. The authenticated route is the same path with the
   session's credential: AIMEAT.auth.getSession().fetch(). `**` covers keys written later, which is
   what lets a subscription work without re-sharing every day.
   The API was on a node branch and not deployed when this was written, so everything here treats a
   404 as "no shares" and the app falls back to the public mirror unchanged. */
async function authFetch(path){
  const s=AIMEAT.auth.getSession&&AIMEAT.auth.getSession();
  if(!s||!s.fetch) return null;
  try{
    const r=await s.fetch(path);
    const body=r&&r.json?await r.json():r;
    return body&&body.ok===false?null:(body&&body.data!==undefined?body.data:body);
  }catch(e){ return null; }
}
async function discoverShares(){
  if(!SESSION) return [];
  const d=await authFetch("/v1/shares/incoming");
  const all=(d&&(d.shares||d.items))||[];
  // Only shares of an Aamukatsaus space; anything else in the inbox is someone else's business.
  return all.filter(s=>String((s&&s.key_pattern)||"").startsWith("aamukatsaus."))
            .map(s=>({pattern:s.key_pattern, owner:s.owner_ghii||s.owner||s.owner_gaii,
                      space:String(s.key_pattern).replace(/\.\*+$/,"")}));
}
/* One record from a shared space — authenticated, by the SHARER's ghii. */
async function shared(owner,key){
  return await authFetch("/v1/memory/"+encodeURIComponent(owner)+"/"+encodeURIComponent(key)+"?soft=1")
    .then(d=>(d&&d.value!==undefined)?d.value:null).catch(()=>null);
}
const dayOf=k=>String(k||"").slice(-10);
const isDay=k=>/\d{4}-\d{2}-\d{2}$/.test(String(k||""));

/* Minimal markdown — the briefing is authored as markdown by postman and the CSP forbids loading a
   parser, so this covers exactly what the mail emits: headings, bold, italics, links, bullets. */
function md(src){
  const out=[]; let list=false;
  for(const line of String(src||"").split("\n")){
    const h=esc(line).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a class="link" href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)"']+)/g,'$1<a class="link" href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/(^|\s)_([^_]+)_(?=\s|$)/g,"$1<i>$2</i>");
    const close=()=>{ if(list){ out.push("</ul>"); list=false; } };
    if(/^###\s/.test(line)){ close(); out.push("<h3>"+h.replace(/^###\s/,"")+"</h3>"); }
    else if(/^##\s/.test(line)){ close(); out.push("<h2>"+h.replace(/^##\s/,"")+"</h2>"); }
    else if(/^#\s/.test(line)){ close(); out.push("<h1>"+h.replace(/^#\s/,"")+"</h1>"); }
    else if(/^[-*]\s/.test(line)||/^\d+\.\s/.test(line)){
      if(!list){ out.push("<ul>"); list=true; }
      out.push("<li>"+h.replace(/^[-*]\s/,"").replace(/^\d+\.\s/,"")+"</li>"); }
    else if(!line.trim()) close();
    else { close(); out.push("<p>"+h+"</p>"); }
  }
  if(list) out.push("</ul>");
  return out.join("\n");
}
const card=(inner,cls="")=>'<div class="card bg-base-200 border border-base-300 mb-3 '+cls+'"><div class="card-body p-4 min-w-0">'+inner+"</div></div>";
const stat=(v,label,tone="")=>'<div class="card bg-base-200 border border-base-300"><div class="card-body p-3 min-w-0">'+
  '<div class="text-2xl font-semibold '+tone+'">'+v+'</div><div class="text-xs opacity-70">'+esc(label)+"</div></div></div>";
const empty=(t,s)=>'<div class="text-center opacity-70 py-16"><div class="font-semibold mb-1">'+esc(t)+
  '</div><div class="text-sm">'+esc(s||"")+"</div></div>";

/* ── Katsaus ─────────────────────────────────────────────────────────────── */
/* A subscriber's OWN briefings arrive as messages, not as a share: creating a group and admitting a
   member are owner-role acts on every surface, so a shared subscription would cost the owner two
   clicks per subscriber forever. A reply to the thread the order came in on costs nobody anything —
   and a message you received is already yours, which settles the copy question too.
   So the reader's inbox is a SOURCE here, read with their own credential. */
async function inboxBriefings(){
  if(!SESSION) return [];
  const d=await authFetch("/v1/messages?per_page=50");
  const msgs=(d&&(d.messages||d.items))||[];
  return msgs.filter(m=>String(m.senderGhii||"").startsWith("postman#")&&
                        /^Aamukatsaus \d{4}-\d{2}-\d{2}/.test(String(m.body||"")))
    .map(m=>({date:String(m.body).slice(12,22), body_md:String(m.body).replace(/^Aamukatsaus \S+\n+/,""),
              from:m.senderGhii, at:m.createdAt}))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
async function viewKatsaus(el){
  let days=[], rec=null, key=null;
  if(SOURCE==="oma"){
    // The reader's own subscription, from their inbox.
    const mine=await inboxBriefings();
    if(!mine.length) return el.innerHTML=empty("Tilaustasi ei ole vielä toimitettu",
      "Tilaus on vastaanotettu, mutta ensimmäinen katsaus rakennetaan seuraavana aamuna klo 7. Se saapuu sinulle viestinä.");
    rec=(BRIEF_DATE&&mine.find(m=>m.date===BRIEF_DATE))||mine[0];
    days=mine.map(m=>"oma."+m.date); key="oma."+rec.date;
  }else if(SOURCE){
    // A subscribed space: the sharer's own dated records. There is no public index for it — the
    // share grants reading, not listing — so the dates are probed backwards from today. `**` means
    // tomorrow's key is covered too, which is why nothing has to be re-shared.
    const today=new Date();
    for(let i=0;i<14;i++){
      const d=new Date(today.getTime()-i*86400000).toISOString().slice(0,10);
      days.push(SOURCE.space+"."+d);
    }
    key=(BRIEF_DATE&&days.find(k=>dayOf(k)===BRIEF_DATE))||null;
    if(key) rec=await shared(SOURCE.owner,key);
    else for(const k of days){ rec=await shared(SOURCE.owner,k); if(rec){ key=k; break; } }
    days=days.filter(k=>k===key||!BRIEF_DATE);
  }else{
    const idx=await loadIndex();
    days=(idx.briefing||[]).filter(isDay);
    key=(BRIEF_DATE&&days.find(k=>dayOf(k)===BRIEF_DATE))||days[0]||null;
    rec=key?await pub(key):await val(KEY_BRIEF+".latest", KEY_BRIEF+".latest");
  }
  if(!rec) return el.innerHTML=empty(SOURCE?"Tilauksessa ei vielä ole raporttia":"Ei vielä yhtään raporttia",
    SOURCE?("Tila "+SOURCE.space+" on jaettu sinulle, mutta siihen ei ole vielä kirjoitettu.")
          :"Aamuraportti julkaisee mail.morning.public.* seuraavassa ajossa.");
  const label=key?dayOf(key):(rec.date||"viimeisin");
  let h="";
  const hasOwn=SOURCE==="oma"||(await inboxBriefings()).length>0;
  if(SHARES.length||hasOwn) h+='<div class="flex flex-wrap items-center gap-2 mb-3"><span class="text-sm opacity-70">Lähde</span>'+
    '<select id="src" class="select select-sm select-bordered"><option value=""'+(SOURCE?"":" selected")+
    ">Avoin katsaus</option>"+(hasOwn?'<option value="oma"'+(SOURCE==="oma"?" selected":"")+
    ">Oma tilaukseni</option>":"")+SHARES.map((s,i)=>'<option value="'+i+'"'+(SOURCE===s?" selected":"")+">"+
    esc(s.space)+"</option>").join("")+"</select></div>";
  h+='<div class="flex flex-wrap items-center gap-3 mb-3"><h1 class="text-xl font-semibold">'+esc(label)+"</h1>";
  if(days.length) h+='<select id="d" class="select select-sm select-bordered">'+days.map(k=>{
    const v=dayOf(k); return '<option'+(k===key?" selected":"")+">"+esc(v)+"</option>"; }).join("")+"</select>"+
    '<span class="text-sm opacity-70">'+days.length+" päivää arkistossa</span>";
  else h+='<span class="badge badge-warning badge-sm">arkisto alkaa seuraavasta ajosta</span>';
  h+="</div>";
  // A recovered day was reconstructed from the mail-request record, which stores body_md[:6000].
  // Saying so is not a detail: a briefing that stops mid-sentence must not read as the whole thing.
  const note=rec.truncated
    ? '<div class="alert alert-warning text-sm mb-3">Tämä päivä on palautettu arkistotietueesta, joka '+
      'tallentaa raportin 6000 ensimmäistä merkkiä. Loppu on vain lähetetyssä sähköpostissa.</div>'
    : (rec.recovered_from?'<div class="text-sm opacity-60 mb-2">Palautettu arkistotietueesta.</div>':"");
  // "Kopioi itselleni": a share can be withdrawn, and then this day is gone from the reader's view
  // even though they read it. A copy lands in THEIR namespace and is theirs to keep — ordinary
  // memory handling. `copiedFrom` travels with it so a kept copy never loses where it came from,
  // and `generatedBy` survives, so the AI provenance is not laundered by the act of copying.
  const canCopy=SESSION&&rec.body_md;
  if(canCopy) h+='<div class="flex items-center gap-3 mb-3"><button id="keep" class="btn btn-sm">Kopioi itselleni</button>'+
    '<span id="kept" class="text-sm opacity-70"></span></div>';
  el.innerHTML=h+note+card('<div class="md min-w-0">'+md(rec.body_md||"(raporttia ei voitu lukea)")+"</div>");
  const keep=el.querySelector("#keep");
  if(keep) keep.onclick=async()=>{
    const note2=el.querySelector("#kept");
    keep.disabled=true; note2.textContent="Kopioidaan…";
    try{
      await AIMEAT.data.set("aamukatsaus.kopio."+(label||"latest"),
        {...rec, copiedFrom:{gaii:(SOURCE&&SOURCE.owner)||PUB_GAII, key:key||(KEY_BRIEF+".latest"),
                             copiedAt:new Date().toISOString()}},{visibility:"private"});
      note2.textContent="Tallennettu omaan muistiisi ✓";
    }catch(e){ note2.textContent="Kopiointi ei onnistunut: "+((e&&e.message)||e); keep.disabled=false; }
  };
  const sel=el.querySelector("#d");
  if(sel) sel.onchange=e=>{ BRIEF_DATE=e.target.value; render(); };
  const src=el.querySelector("#src");
  if(src) src.onchange=e=>{ const v=e.target.value;
    SOURCE=v===""?null:(v==="oma"?"oma":SHARES[+v]); BRIEF_DATE=null; render(); };
}

/* ── Pulssi ──────────────────────────────────────────────────────────────── */
async function viewPulssi(el){
  const idx=await loadIndex();
  const p=await val("mail.pulse.public.latest", KEY_PULSE+".latest");
  if(!p) return el.innerHTML=empty("Pulssidataa ei vielä ole","crewaimeat.pulse kirjoittaa sen aamuajossa.");
  const e=p.edition||{}, s=(p.spend||{}).totals||{}, by=(p.spend||{}).by_agent||[];
  const done=(e.articles||0)>=12&&e.editorial;
  let h='<h1 class="text-xl font-semibold">Pulssi</h1><div class="text-sm opacity-70 mb-3">Mitattu '+
    esc(p.generated_at||"")+" · ikkuna "+(p.window_hours||24)+" h</div>";
  h+='<div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">'+
    stat(num(e.articles),"artikkelia"+(done?" · lehti valmis":" · vajaa"),done?"text-success":"text-warning")+
    stat(num(e.raw_categories),"raw-kategoriaa")+stat(num(e.keys),"muistiavainta / painos")+
    stat(num(s.calls),"LLM-kutsua")+stat(usd(s.cost_usd),"kulut 24 h")+stat(num(s.total_tokens),"tokenia")+"</div>";
  if(by.length) h+='<h2 class="font-semibold mb-2">Kulut agenteittain</h2>'+card('<div class="scroll-x">'+
    '<table class="table table-sm"><thead><tr><th>agentti</th><th>kutsuja</th><th>tokeneita</th><th>$</th></tr></thead><tbody>'+
    by.map(g=>"<tr><td>"+esc(g.agent)+"</td><td>"+num(g.calls)+"</td><td>"+num(g.tokens)+"</td><td>"+usd(g.cost_usd)+"</td></tr>").join("")+
    "</tbody></table></div>");
  if((p.memory||[]).length) h+='<h2 class="font-semibold mb-2">Muistiin kirjoitettu</h2>'+card('<div class="scroll-x">'+
    '<table class="table table-sm"><thead><tr><th>nimiavaruus</th><th>avainta</th></tr></thead><tbody>'+
    p.memory.map(m=>"<tr><td>"+esc(m.namespace)+"</td><td>"+num(m.written)+"</td></tr>").join("")+"</tbody></table></div>");
  const days=(idx.pulse||[]).filter(isDay).slice(0,14);
  if(days.length>1){
    const rows=[];
    for(const k of days){ const r=await pub(k); if(r) rows.push([dayOf(k),(r.edition||{}).articles,((r.spend||{}).totals||{}).calls,((r.spend||{}).totals||{}).cost_usd]); }
    h+='<h2 class="font-semibold mb-2">Viime päivät</h2>'+card('<div class="scroll-x">'+
      '<table class="table table-sm"><thead><tr><th>päivä</th><th>artikkeleita</th><th>LLM-kutsuja</th><th>$</th></tr></thead><tbody>'+
      rows.map(r=>"<tr><td>"+esc(r[0])+"</td><td>"+num(r[1])+"</td><td>"+num(r[2])+"</td><td>"+usd(r[3])+"</td></tr>").join("")+
      "</tbody></table></div>");
  }
  el.innerHTML=h;
}

/* ── Jono ────────────────────────────────────────────────────────────────── */
async function viewJono(el){
  const q=await val("some.queue.public.latest", KEY_QUEUE);
  if(!q) return el.innerHTML=empty("Jonoa ei ole vielä koottu","crewaimeat.review_queue.publish() kirjoittaa some.queue.latest.");
  const b=q.backlog||{}, items=q.items||[];
  let h='<h1 class="text-xl font-semibold">Katselmointijono</h1><div class="text-sm opacity-70 mb-3">Koottu '+
    esc(q.generated_at||"")+" · enintään "+(q.fresh_days||7)+" vrk vanhat</div>";
  h+='<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">'+
    stat(num(items.length),"odottaa sinua","text-success")+stat(num(b.drafts_expired),"vanhentunut","text-warning")+
    stat(num(b.opportunities_total),"osumaa yhteensä")+
    stat(num(b.posted_total),"koskaan postattu",(b.posted_total||0)>0?"text-success":"text-error")+"</div>";
  if(b.note) h+=card('<span class="text-sm opacity-80">'+esc(b.note)+"</span>");
  if(!items.length) h+=empty("Ei tuoreita luonnoksia","Kaikki ajankohtainen on käsitelty.");
  for(const it of items){
    h+='<details class="collapse collapse-arrow bg-base-200 border border-base-300 mb-2"><summary class="collapse-title min-w-0">'+
      '<div class="flex flex-wrap items-center gap-2"><span class="badge badge-sm badge-primary">fit '+num(it.fit_score)+"</span>"+
      '<span class="badge badge-sm badge-ghost">'+esc(it.platform||"?")+"</span>"+
      '<span class="font-semibold">'+esc(it.title)+"</span></div>"+
      // The date and the thread id are on the ROW, not hidden in the body: HN reposts the same story
      // and Ask HN questions recur, so two rows legitimately share a title while being different
      // discussions. Without something distinguishing them the list looks duplicated and a reviewer
      // has to open both to find out it is not.
      '<div class="text-sm flex flex-wrap gap-3 items-center">'+
      (it.url?'<a class="link" href="'+esc(it.url)+'" target="_blank" rel="noopener">Avaa ketju →</a>'
             :'<span class="text-error">linkki puuttuu</span>')+
      (it.found_date?'<span class="opacity-60">löydetty '+esc(it.found_date)+"</span>":"")+
      '<span class="opacity-50 font-mono text-xs">'+esc(String(it.id||"").replace(/^draft-opp-/,""))+"</span></div>"+
      '</summary><div class="collapse-content min-w-0">'+
      (it.summary?'<p class="text-sm opacity-80 mb-1">'+esc(it.summary)+"</p>":"")+
      (it.angle?'<p class="text-sm mb-2"><b>Kulma:</b> '+esc(it.angle)+"</p>":"")+
      '<pre class="raw bg-base-300 rounded p-3 text-sm">'+linkify(it.draft||"(luonnos tyhjä)")+"</pre>"+
      '<div class="text-xs opacity-60 mt-1">'+esc(it.id)+" · löydetty "+esc(it.found_date||"?")+"</div></div></details>";
  }
  el.innerHTML=h;
}

/* ── Grok ────────────────────────────────────────────────────────────────── */
function grokPromptFrom(body){
  const m=String(body||"").match(/## Grok-ajo[\s\S]*?```([\s\S]*?)```/);
  return m?m[1].trim():"";
}
async function viewGrok(el){
  const idx=await loadIndex();
  const brief=await val(KEY_BRIEF+".latest", KEY_BRIEF+".latest")||await pub((idx.briefing||[])[0]||"");
  const prompt=grokPromptFrom(brief&&brief.body_md);
  let h='<h1 class="text-xl font-semibold">Grok-ajo</h1><div class="text-sm opacity-70 mb-3">'+
    "Aja prompti Grokissa ja liitä tuloste tähän. Agentti jäsentää sen, vie osumat Social Radarille ja arkistoi ajon.</div>";
  h+=card('<div class="flex items-center gap-3 mb-2"><b>Prompti</b>'+
    '<button id="copy" class="btn btn-xs"'+(prompt?"":" disabled")+">Kopioi</button></div>"+
    '<pre class="raw bg-base-300 rounded p-3 text-sm">'+esc(prompt||"(promptia ei löytynyt viimeisimmästä raportista)")+"</pre>");
  h+=card("<b>Grokin tuloste</b>"+
    '<p class="text-sm opacity-70 mb-2">Yksi rivi per osuma: <code>SCORE | PLATFORM | TITLE | URL | WHY</code></p>'+
    (SESSION
      ? '<textarea id="paste" class="textarea textarea-bordered w-full font-mono text-sm" rows="9" placeholder="Liitä Grokin tuloste tähän sellaisenaan…"></textarea>'+
        '<div class="flex items-center gap-3 mt-2"><button id="send" class="btn btn-sm btn-primary">Tallenna jäsennettäväksi</button>'+
        '<span id="sent" class="text-sm opacity-70"></span></div>'
      // Reading is open to anyone with the link; WRITING needs an account, because the paste lands
      // in the writer's own namespace and only the owner's agents drain that inbox.
      : '<div class="alert alert-info text-sm">Kirjaudu (oikea yläkulma) tallentaaksesi ajon. Promptin voi kopioida ilman kirjautumista.</div>'));
  const gDays=((await loadIndex()).grok||[]).filter(isDay).slice(0,10);
  if(gDays.length){
    h+='<h2 class="font-semibold mb-2">Arkisto</h2>';
    for(const gk of gDays){
      const rec=await pub(gk), runs=(rec&&rec.runs)||[];
      h+='<details class="collapse collapse-arrow bg-base-200 border border-base-300 mb-2">'+
        '<summary class="collapse-title"><b>'+esc(dayOf(gk))+'</b> <span class="opacity-70 text-sm">'+
        runs.length+" ajo(a)</span></summary><div class=\"collapse-content min-w-0\">"+
        runs.map(r=>{ const res=r.result||{};
          return '<div class="flex flex-wrap gap-2 mb-1"><span class="badge badge-sm badge-success">'+num(res.added)+" lisätty</span>"+
            '<span class="badge badge-sm badge-ghost">'+num(res.skipped)+" jo tiedossa</span>"+
            (res.rejected?'<span class="badge badge-sm badge-error">'+num(res.rejected)+" hylätty</span>":"")+
            '<span class="text-xs opacity-60">'+esc(r.pasted_at||"")+" · "+esc(r.by||"")+"</span></div>"+
            '<pre class="raw bg-base-300 rounded p-2 text-xs">'+esc((r.text||"").slice(0,1200))+"</pre>"; }).join("")+
        "</div></details>";
    }
  }
  el.innerHTML=h;
  const copy=el.querySelector("#copy");
  if(copy) copy.onclick=async()=>{ try{ await navigator.clipboard.writeText(prompt); copy.textContent="Kopioitu ✓"; }
    catch(e){ copy.textContent="Kopiointi ei onnistunut"; } };
  const send=el.querySelector("#send");
  if(send) send.onclick=async()=>{
    const ta=el.querySelector("#paste"), btn=el.querySelector("#send"), note=el.querySelector("#sent");
    const text=(ta.value||"").trim();
    if(!text){ note.textContent="Liitä ensin tuloste."; return; }
    btn.disabled=true; note.textContent="Tallennetaan…";
    try{
      const ts=new Date().toISOString().replace(/[-:]/g,"").slice(0,15);
      await AIMEAT.data.set("some.grok.inbox."+ts,
        {pasted_at:new Date().toISOString(),by:"app",text:text,status:"pending"},{visibility:"owner"});
      ta.value=""; note.textContent="Tallennettu ✓ — agentti jäsentää sen seuraavassa ajossa.";
    }catch(e){ note.textContent="Tallennus ei onnistunut: "+((e&&e.message)||e); }
    btn.disabled=false;
  };
}

/* ── Tilaus ──────────────────────────────────────────────────────────────────
   An order travels as a MESSAGE, not as a write. An app grant resolves to its own owner's
   namespace, so a reader's browser has no route into ours — but `messages:send` is a scope an app
   may hold, and postman already drains a federated inbox. So the order is DMed, validated on our
   side where the validation lives, and answered. No group, no share and no owner action stand
   between a reader and placing one.
   Reading the order back uses the share, when there is one: that is the only way the subscriber can
   verify what we actually hold about them rather than what they meant to send. */
const ORDER_MARKER="[AAMUKATSAUS-TILAUS]";
async function currentOrder(){
  for(const s of SHARES){
    const o=await shared(s.owner, s.space+".prefs");
    if(o&&o.subscriber) return o;
  }
  return null;
}
async function viewTilaus(el){
  if(!SESSION) return el.innerHTML=empty("Kirjaudu tilataksesi",
    "Tilaus lähetetään sinun nimissäsi, joten se vaatii tilin. Kirjaudu oikeasta yläkulmasta.");
  const cur=await currentOrder();
  const v=k=>esc(((cur&&cur[k])||(k==="topic"?"":[])).toString().split(",").join(", "));
  let h='<h1 class="text-xl font-semibold mb-1">Oma aamukatsaus</h1>'+
    '<div class="text-sm opacity-70 mb-4">Kolme kenttää, ja katsaus rakentuu niistä joka aamu. '+
    "Jätä kenttä tyhjäksi jos et halua sitä osiota.</div>";
  if(cur) h+='<div class="alert alert-success text-sm mb-4">Tilaus on voimassa ('+esc(cur.subscriber)+
    "). Alla on se mitä pidämme tallessa — muokkaa ja lähetä, niin se korvautuu.</div>";
  const field=(id,title,help,val,ph)=>card("<b>"+esc(title)+"</b>"+
    '<p class="text-sm opacity-70 mb-2">'+esc(help)+"</p>"+
    '<input id="'+id+'" class="input input-bordered w-full" value="'+val+'" placeholder="'+esc(ph)+'">');
  h+=field("f_comp","Kilpailijat","Ketä seurataan. Yksi haku per nimi, pilkulla eroteltuna.",
           v("competitors"),"Kilpailija Oy, toinen firma");
  h+=field("f_radar","Aiheseuranta","Mistä aiheista haluat viikon uutuudet.",
           v("radar"),"tekoäly sote-alalla, hoitajapula");
  h+=field("f_topic","Grok-ajo","Yksi aihe, josta saat valmiin promptin ajettavaksi.",
           v("topic"),"agenttien käyttö terveydenhuollossa");
  h+='<div class="flex flex-wrap items-center gap-3 mt-2"><button id="order" class="btn btn-primary">'+
    (cur?"Päivitä tilaus":"Tilaa")+'</button><span id="ordered" class="text-sm opacity-70"></span></div>'+
    '<p class="text-sm opacity-60 mt-4">Enintään 5 hakua per kenttä — jokainen on oikea haku joka '+
    "aamu, ja katto pitää tilauksen hinnan ennustettavana.</p>";
  el.innerHTML=h;
  el.querySelector("#order").onclick=async()=>{
    const btn=el.querySelector("#order"), note=el.querySelector("#ordered");
    const g=id=>(el.querySelector("#"+id).value||"").trim();
    const order={competitors:g("f_comp"),radar:g("f_radar"),topic:g("f_topic")};
    if(!order.competitors&&!order.radar&&!order.topic){
      note.textContent="Täytä ainakin yksi kenttä — tyhjä tilaus tuottaisi tyhjän katsauksen."; return; }
    btn.disabled=true; note.textContent="Lähetetään…";
    const s=AIMEAT.auth.getSession&&AIMEAT.auth.getSession();
    try{
      const r=await s.fetch("/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({to:PUB_GAII,subject:"Aamukatsaus-tilaus",
          body:ORDER_MARKER+"\n"+JSON.stringify(order)})});
      const b=r&&r.json?await r.json():r;
      if(b&&b.ok===false) throw new Error((b.error&&(b.error.message||b.error.code))||"lähetys epäonnistui");
      note.textContent="Lähetetty ✓ — saat vahvistuksen viestinä, ja katsaus alkaa seuraavana aamuna.";
    }catch(e){ note.textContent="Lähetys ei onnistunut: "+((e&&e.message)||e); btn.disabled=false; }
  };
}

/* ── shell ───────────────────────────────────────────────────────────────── */
const VIEWS={katsaus:viewKatsaus,pulssi:viewPulssi,jono:viewJono,grok:viewGrok,tilaus:viewTilaus};
async function render(){
  const el=document.getElementById("view"), st=document.getElementById("status");
  st.textContent="Ladataan…"; el.innerHTML="";
  try{ await VIEWS[TAB](el); st.textContent=""; }
  catch(e){ st.innerHTML='<div class="alert alert-error">Näkymän lataus epäonnistui: '+esc((e&&e.message)||e)+"</div>"; }
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("tab-active",x===b));
  render();
});
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script");
  s.src=src; s.onload=res; s.onerror=()=>rej(new Error("skriptin lataus epäonnistui: "+src));
  document.head.appendChild(s); }); }
async function boot(){
  const st=document.getElementById("status");
  // /v1/libs/ — NOT /lib/, which is the CSS/vendor path and 404s for these two (curated pitfall
  // invented-lib-urls). Verified against the spec and with a live request before publishing.
  try{ await loadScript("https://aimeat.io/v1/libs/aimeat-auth.js"); await loadScript("https://aimeat.io/v1/libs/aimeat-data.js"); }
  catch(e){ st.textContent=String((e&&e.message)||e); return; }
  // BOTH auth paths (curated pitfall handle-both-auth-paths): the silent restore below, and the
  // onLogin callback for a fresh sign-in through the pill.
  if(AIMEAT.auth.mountLoginButton)
    AIMEAT.auth.mountLoginButton("#header-auth",{
      onLogin:s=>{ SESSION=s||AIMEAT.auth.getSession(); INDEX=null; render(); },
      onLogout:()=>{ SESSION=null; INDEX=null; render(); }});
  try{ SESSION=(await AIMEAT.auth.login())||AIMEAT.auth.getSession(); }catch(e){ SESSION=null; }
  // Silent when the share API is absent (it was on a node branch when this shipped): no shares
  // found means the source selector never appears and the app behaves exactly as before.
  try{ SHARES=await discoverShares(); }catch(e){ SHARES=[]; }
  // NO login gate on reading. The data is a public mirror, so a colleague opens the link and sees
  // exactly what the owner sees; signing in only adds the owner's fresher un-mirrored copy and the
  // ability to submit a Grok run.
  render();
}
boot();
</script>
