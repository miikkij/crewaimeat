[project]
name = "crewaimeat"
version = "0.7.0"
description = "AIMEAT × CrewAI integration: a validated crew template (liaison + daemon + live progress + date injection) for connecting CrewAI crews to AIMEAT.io, with example crews."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.6",  # 1.15.6: execution_end hook fires on FAILED crews/flows + strict tool schema names. 1.15.3: fixed after_llm_call hooks breaking native tool execution + per-call usage metrics on kickoff results + token usage under both names (all directly help our hook-based ledger metering). 1.14.7: per-run state isolation (concurrent daemons), custom-BaseLLM
    #                           restore fix, aiohttp/docling CVE fixes, faster import
    # 0.20.0: DATA PACKAGES — read_package / to_dataframe / to_parquet / publish_package /
    # package_versions + QualityGateRefused. The `data` extra brings pandas (to_dataframe), `parquet`
    # brings pyarrow. Declared HERE and not with `uv pip install`, because start_fleet.ps1 runs
    # `uv sync` and silently reverts anything the lockfile does not know about — measured: an ad-hoc
    # 0.20.0 install was back on 0.19.0 the moment the fleet started.
    "aimeat-crewai[data,parquet]>=0.21.0",  # 0.21.0: the daemon's PROPOSE phase also picks up ACTIVE tasks with no live plan. THE FLOOR IS REQUIRED, not cosmetic: PROPOSE used to poll status='queued' only, and a TASK-RUNNER HAS NO QUEUED TASKS — the node auto-activates them on create, and the Hello Integration test task is born 'active' for every mode. So no TODO plan was ever proposed, EXECUTE completed the task with an empty plan, and onboarding jammed at 6/7 forever: accept_test_task passes only when the test task carries todos, complete_test_task passed anyway, and a completed task refuses a plan. Every crewaimeat crew is a task-runner (CrewSpec.mode derives it), so below this floor NONE of them can finish onboarding. 0.19.0: `declare(provider=...)` — who SERVED the model, beside which model wrote it. The floor is REQUIRED, not cosmetic: 0.18.0 shipped TWICE (PyPI without the kwarg, source with it), so a >=0.18.0 pin could resolve to a build where `provider=` raises TypeError. 0.18.0: content provenance — crews declare how their output was made (ai_provenance: level / method / human_involvement / model / sources) and the node stamps writes that declare nothing. NEEDS AIMEAT NODE >= 2.4.0, because the block only means something to a node carrying the provenance surface; against an older node (or an older connector — the npm `aimeat` CLI whose write-tool schemas lack the field) the block is DROPPED SILENTLY and the write is recorded "ai-generated / declared no provenance", i.e. a declaration of human authorship disappears with no error. ALSO NEEDS THE npm `aimeat` CONNECTOR >= 2.6.1 (2.6.0's published tarball could not be installed, fixed in 2.6.1 along with a provenance-page XSS; 2.6.0 is the version that first carried `provider` through the connector's OWN carrying module, src/cli/connect/ai-provenance-carry.ts — the node's MCP surface having it was not enough, because crews reach the node only through that module) — this is the floor that actually bites, because the fleet's crews reach the node only through `aimeat connect serve`, and the CLI is spawned from the MACHINE's global npm install, which no lockfile here pins. Verified empirically 2026-08-01: connector 2.4.0 accepted the block, minted a record and stored "declared no provenance" (dropped OUTBOUND, before the node saw it); the same version also dropped it INBOUND, because GET /v1/memory/:key serves the record on the envelope's `meta.provenance` and every connector tool unwrapped with `resp.data ?? resp`, binning the envelope — so reads returned only `ai_provenance_id` and `read_provenance()` never saw a record. 2.5.0 carries it in BOTH directions. 0.16.2: text-LLM calls priced from OpenRouter usage.cost (needs extra_body usage.include, shipped df602c9) + model-id normalization (routing prefix -> provider, one row per model). 0.16.1: per-AGENT ledger attribution in the fleet host — each LLM call is metered to the EMITTING agent (ContextVar), not the first-installed one; needed because we run the whole fleet in one process. 0.16.0: per-LLM-call usage telemetry → node ledger (LEDGER TARGET-016) — daemon auto-meters every crew LLM call to /v1/ledger/usage via CrewAI's event bus; needs AIMEAT node>=1.38. 0.15.0: latest (owner-updated 2026-07-04). 0.14.0: contract ENGAGEMENTS — daemon._handle_record gates the record-push path on the (agent×contract×workspace) engagement (retired -> skip; active/absent -> process; legacy backfill), fail-open on read error. NB the poll/discovery path is NOT gated by the package — a polling crew must run its own engagement check (see crewaimeat contract crews). 0.13.0: liaison tool arg-repair — the connector fills a missing REQUIRED arg (e.g. propose_todos.title) from a sibling field before pydantic validation, so a model that omits it no longer loops on the same call; + a max_iter cap on factory-built liaison agents. Reaches crewfive's wrapped tools (create_liaison_agent(...).tools). 0.12.0: deterministic Hello Integration driver (run_hello_integration) — aimeat_onboarding_status returns a per-step howTo + top-level step_guide + summary.completable; drive onboarding from the payload (call howTo.tool with howTo.args, stop at completable) instead of letting the LLM guess aimeat_onboarding_<step> names. Removes the model from onboarding tool-selection (biggest robustness win for small/local models). Needs AIMEAT node>=1.35 + connector 1.35.0; the 16 step ids + 5 aimeat_onboarding_* tool names are a frozen contract. 0.11.0: liaison onboarding gap fixed — publish_commands writes agents.<name>.commands, make_workflow_compatible loads the offers tools (aimeat_offers_check/_publish) + prompts the workflow-compat offer, price_offer stays optional (auto-skipped) so a crew like mapmaker finishes Hello Integration; MCP-drift = aimeat_organism_search archived param (needs connector >=1.34). 0.10.0: aimeat_discover — the MASTER DIRECTORY (one faceted query across every node domain: capabilities/workflows/knowledge/decisions/research/material/companies/docs/apps/memory; mode=map|find, scope=own|public|shared; needs AIMEAT node/connector >=1.32 for the MCP/liaison path, >=1.32.1 to ALSO call it shell-callable via `aimeat connect call` — see crewaimeat.discover for the deterministic helpers) + a liaison backstory that steers crews to aimeat_discover first. 0.9.0: interactive messages — aimeat_dm_ask (federated AskUserQuestion) + on_dm event `interactive` field (questions|answers|None) + serve_client/build_question/ask/read_answers helpers (needs AIMEAT node>=1.31); 0.8.1: fix the DM/record wake-consume (the idle wake long-poll now RETURNS the popped event to on_dm/on_record instead of discarding it); 0.8.0: federated-inbox DM trigger (listen_for="dms" + on_dm, drains /local/dm/next; needs AIMEAT node>=1.30.2); 0.7.1: daemon re-lists tasks only on a push wake (kills the idle tunnel re-list storm) + task.cancelled push; 0.7.0: event push over the tunnel (listen_for="records" + record_spaces + on_record, auth_revoked self-exit, aimeat_agent_statistics tool)
    #                          + aimeat_crewai.paths.aimeat_home single source; 0.5.0: native offers +
    #                          workflow-compat (Sig, build_offer/publish_offers, aimeat-offers CLI, liaison)
    "tavily-python>=0.5.0",  # optional Tavily fallback (USE_TAVILY=1); default web search is SearXNG/DDG
    "ddgs>=6.0",             # free DuckDuckGo web search — zero-infra fallback when no SearXNG is running
    "requests>=2.31",        # SearXNG web-search tool + REST helpers + qwen-vl vision (browser screenshots)
    "playwright>=1.44",      # web-tester browser tool (plan-then-execute); needs `uv run playwright install chromium`
    "python-dotenv>=1.0.1",
    "tzdata",  # zoneinfo tz database (needed on Windows for current-time injection)
    "pyfiglet>=1.0.0",  # deterministic ASCII-art for [[FIGLET]] README directives
    "trafilatura>=2.0.0",
    "litellm>=1.87.1",
    "feedparser>=6.0.12",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]  # the fleet TUI (crewaimeat-tui); optional so the core install stays lean
# The appliance's watchdog runs crews via a bare `uv run` and today only finds uv.exe in the venv
# because crewai-cli HAPPENS to depend on the `uv` package — pin that lifeline explicitly.
agency = ["fastapi>=0.110", "uvicorn>=0.27", "uv>=0.7"]  # the aimeat-agency cockpit server (crewaimeat.agency.cockpit)

[project.scripts]
crewaimeat = "crewaimeat.scaffold:main"
crewaimeat-tui = "crewaimeat.tui.app:main"
crewaimeat-doctor = "crewaimeat.doctor.cli:main"   # also `crewaimeat doctor`
crewaimeat-costs = "crewaimeat.fleet_economics:main"  # also `crewaimeat costs`
crewaimeat-quality = "crewaimeat.quality:main"        # also `crewaimeat quality`
crewaimeat-orphans = "crewaimeat.node_cleanup:main"   # also `crewaimeat orphans`
research-crew = "crewaimeat.research_crew:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewaimeat"]

# Ship the cockpit's web UI (HTML/CSS/JS) + the built-in JSON brain templates with the package so a
# packaged aimeat-agency serves the UI and loads its data-driven templates at the same module-relative path.
[tool.hatch.build.targets.wheel.force-include]
"src/crewaimeat/agency/static" = "crewaimeat/agency/static"
"src/crewaimeat/agency/templates" = "crewaimeat/agency/templates"

[dependency-groups]
dev = ["pytest>=8.0", "textual>=0.60", "ruff>=0.6", "pre-commit>=3.5", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]  # textual: TUI tests; fastapi/uvicorn/httpx: cockpit + its TestClient; ruff: lint+format; pre-commit: git hooks

[tool.ruff]
# Match the existing house style (wide lines, py310 floor). Generated/vendored trees are excluded.
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".aimeat", "logs", "docs"]

[tool.ruff.lint]
# A pragmatic, low-noise starter set: pyflakes (F) + pycodestyle (E/W) + import sorting (I) +
# pyupgrade (UP) + bugbear (B) + comprehensions (C4) + a few simplifications (SIM). Tighten over time.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter (avoids churn on long comments)
    "B008",    # CrewAI/Typer patterns call functions in argument defaults by design
    "SIM105",  # `contextlib.suppress` over try/except-pass — the explicit form reads clearer here
    # House idioms kept after the initial Ruff adoption — tighten later if desired:
    "E741",    # short names (l/I/O) appear in a few tight comprehensions/loops
    "SIM115",  # `open(p).read()` one-liners are the established pattern for tiny config reads
    "C408",    # `dict(...)` calls are used deliberately for kwargs-style construction
    "W291",    # trailing whitespace inside multi-line string literals (intentional spacing)
    "B905",    # `zip()` without strict= — the lengths are known-equal at the call sites
    "SIM118",  # `key in dict.keys()` reads clearer in the one spot it occurs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # tests set up sys.path / env before importing the package under test
"crews/*" = ["E402"]   # a few crews import lazily inside build_domain after a guard

[tool.pytest.ini_options]
# The L1/L2 test floor: deterministic, no LLM, no network. See docs/aimeat-guides/nextgeneration/
# 10-testing-and-evaluation-plan.md. pythonpath lets tests import crews.<x> and the shared fixtures.
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
