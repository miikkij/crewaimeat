# Builds the aimeat-agency desktop installer (Tauri, Windows) on a GitHub runner and publishes it as a
# downloadable GitHub Release. Triggered by an `agency-v*.*.*` tag whose numeric part must match
# aimeat-agency/src-tauri/tauri.conf.json `version` (mirror of aimeat-protocol's release-desktop gate).
#
# Why CI: GitHub's windows-latest runner uses the MSVC Rust toolchain, which skips windres entirely —
# so the build works regardless of a dev machine's mingw/gcc state. workflow_dispatch builds only (a
# smoke test, no release); a tag publishes the release.
name: Release aimeat-agency

on:
  push:
    tags:
      - 'agency-v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release and upload installer assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#agency-v}"
          MANIFEST="$(node -p "require('./aimeat-agency/src-tauri/tauri.conf.json').version")"
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag agency-v$TAG does not match tauri.conf.json version $MANIFEST. Bump the manifest before tagging."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10 # crewfive root is a Python repo (no package.json), so pin pnpm explicitly

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # windows-latest defaults to the x86_64-pc-windows-msvc host target (MSVC + Windows SDK
      # preinstalled) — no windres, no mingw. This is the whole point of building in CI.
      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo / Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: aimeat-agency/src-tauri

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Bundle the crewaimeat SOURCE snapshot + the uv binary so the installer is self-contained
      # (no git, no pre-installed tools). First run copies the source out + `uv sync`s it.
      - name: Stage runtime (crewaimeat source + uv sidecar)
        shell: pwsh
        run: |
          $ag = "aimeat-agency/src-tauri"
          $src = "$ag/resources/runtime-src"
          New-Item -ItemType Directory -Force $src | Out-Null
          # crewaimeat source snapshot (exclude dev/heavy dirs; robocopy exit <8 = success).
          # crews/tests/infra/benchmarks/output/secretary are DEV-fleet material: shipping crews/ made
          # the appliance's Fleet page show ~40 unfamiliar dev agents to a non-dev operator.
          robocopy . $src /E /XD .git aimeat-agency .github node_modules .venv .aimeat logs docs crews tests infra benchmarks output secretary .ruff_cache .pytest_cache /XF *.pyc *.log | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }; $global:LASTEXITCODE = 0
          # uv sidecar, named for the Rust host triple Tauri expects (windows-latest = msvc)
          $triple = (((rustc -vV) -split "`n" | Select-String '^host:') -replace '^host:\s*','').Trim()
          $bin = "$ag/binaries"; New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item (Get-Command uv).Source "$bin/uv-$triple.exe"
          Write-Host "Staged: source -> $src ; uv -> $bin/uv-$triple.exe (triple $triple)"

      - name: Install Tauri CLI
        run: pnpm install --frozen-lockfile
        working-directory: aimeat-agency

      - name: Build installers (NSIS + MSI) — signed for the updater
        run: pnpm tauri build
        working-directory: aimeat-agency
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List built bundles
        shell: bash
        run: ls -R aimeat-agency/src-tauri/target/release/bundle || true

      # The installer is self-contained: the crewaimeat source + uv are staged above and bundled, so first
      # run provisions with no git and no pre-installed tools (uv fetches Python + deps online once).
      - name: Assemble release files + updater latest.json
        shell: bash
        run: |
          mkdir -p dist
          NSIS=aimeat-agency/src-tauri/target/release/bundle/nsis
          cp "$NSIS"/*-setup.exe dist/ 2>/dev/null || true
          cp aimeat-agency/src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          # Build the updater manifest the app polls: version + the minisign signature + the download URL.
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == agency-v* ]]; then
            VER="${GITHUB_REF_NAME#agency-v}"
            SIGFILE="$NSIS/aimeat-agency_${VER}_x64-setup.exe.sig"
            if [ -f "$SIGFILE" ]; then
              SIG="$(cat "$SIGFILE")"
              URL="https://github.com/miikkij/crewaimeat/releases/download/${GITHUB_REF_NAME}/aimeat-agency_${VER}_x64-setup.exe"
              printf '{\n  "version": "%s",\n  "notes": "aimeat-agency %s",\n  "pub_date": "%s",\n  "platforms": { "windows-x86_64": { "signature": "%s", "url": "%s" } }\n}\n' \
                "$VER" "$VER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$URL" > dist/latest.json
              echo "wrote dist/latest.json"; cat dist/latest.json
            else
              echo "WARNING: no .sig at $SIGFILE — updater latest.json NOT written (signing secret missing?)"
            fi
          fi
          ls -la dist

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aimeat-agency-windows
          path: dist/*
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: aimeat-agency ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
