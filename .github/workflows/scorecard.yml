# OSSF Scorecard: the supply-chain posture check for a public repo. It scores the repository against
# the Open Source Security Foundation's checks — pinned actions, least-privilege workflow permissions,
# branch protection, a security policy, dangerous workflow patterns — and uploads the result to the
# Security tab as tracked alerts. Advisory; nothing here blocks a merge. `publish_results` posts the
# score to the public OSSF dashboard.

name: Scorecard supply-chain

on:
  branch_protection_rule:
  schedule:
    - cron: '20 5 * * 1' # weekly, an hour after the CodeQL refresh
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write        # publish the signed result to the OSSF dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: results.sarif
