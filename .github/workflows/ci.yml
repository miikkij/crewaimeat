name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies (incl. dev)
        run: uv sync --group dev

      # Format + lint are HARD gates: the tree was formatted and auto-fixed in the adoption commit,
      # and the handful of grandfathered findings carry targeted `# noqa` or sit in the ignore list
      # (see [tool.ruff.lint] in pyproject.toml). New/changed code is also held to these by pre-commit.
      - name: Ruff format (check)
        run: uv run ruff format --check src tests crews

      - name: Ruff lint
        run: uv run ruff check src tests crews

      # The deterministic test floor: no LLM, no network (see [tool.pytest.ini_options]).
      - name: Pytest
        run: uv run pytest

      # The reconciliation gate — the check ruff structurally cannot perform. Ruff reads one file and
      # asks whether the statement is well formed; doctor reads the whole repo and asks whether the
      # six agent registries agree and whether every call reaches the node / a model through the
      # sanctioned route. Offline and ~1s; the node lens (--live) is deliberately NOT run here,
      # because CI has no fleet and a check that cannot look must never report "fine".
      #
      # --strict makes warnings fail too. Pre-existing findings live in doctor-baseline.json, which
      # may only SHRINK: a new violation of a baselined rule still fails the build.
      - name: Doctor (registries + route conformance)
        run: uv run crewaimeat doctor --strict
